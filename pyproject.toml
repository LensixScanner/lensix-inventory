[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lensix-inventory"
version = "0.2.1"
description = "Gather an AWS/Azure/GCP account inventory and upload it to Lensix, or self-host as a scheduled container — without ever giving Lensix live access to your cloud account."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

# Base install (`pip install lensix-inventory`) has no cloud-SDK
# dependencies at all — matches requirements.txt's own comment that the
# provider-specific files are what actually pull in boto3/azure-*/google-*.
# Install exactly one extra for the provider you need (e.g.
# `lensix-inventory[aws]`), mirroring run.sh's own "only install what this
# provider needs" behavior.
dependencies = []

[project.optional-dependencies]
# Kept in sync with requirements-aws.txt / requirements-azure.txt /
# requirements-gcp.txt by hand — those files remain the source ./run.sh's
# venv bootstrap installs from directly (pip install -r ...), so a
# contributor adding a new gather module's dependency should still update
# the matching requirements-<provider>.txt too, not just here.
aws = [
    "boto3>=1.34",
]
azure = [
    "azure-identity>=1.15",
    "azure-core>=1.29",
    "azure-mgmt-compute>=30.0",
    "azure-mgmt-network>=25.0",
    "azure-mgmt-storage>=21.0",
    # <25.0: 25.0.0 dropped the azure.mgmt.resource top-level re-export
    # of PolicyClient (needed by lensix_inventory/azure/policy.py) and
    # the azure.mgmt.resource.locks submodule; last confirmed-working
    # release is 24.0.0. Kept in sync with requirements-azure.txt below.
    "azure-mgmt-resource>=23.0,<25.0",
    "azure-mgmt-subscription>=3.0",
    "azure-mgmt-monitor>=6.0",
    "azure-mgmt-containerservice>=29.0",
    "azure-mgmt-containerregistry>=10.0",
    "azure-mgmt-apimanagement>=4.0",
    "azure-mgmt-web>=7.0",
    "azure-mgmt-authorization>=4.0",
    "azure-mgmt-cdn>=12.0",
    "azure-mgmt-cosmosdb>=9.0",
    "azure-mgmt-datafactory>=3.0",
    "azure-mgmt-datalake-store>=0.5",
    "azure-mgmt-security>=5.0",
    "azure-mgmt-eventgrid>=10.0",
    "azure-mgmt-eventhub>=10.0",
    "azure-mgmt-frontdoor>=1.0",
    "azure-mgmt-rdbms>=10.0",
    "azure-mgmt-recoveryservices>=3.0",
    "azure-mgmt-redis>=14.0",
    "azure-mgmt-servicebus>=8.0",
    "azure-mgmt-sql>=4.0",
    "azure-mgmt-synapse>=2.0",
    "azure-keyvault-keys>=4.8",
    "azure-keyvault-secrets>=4.7",
]
gcp = [
    "google-auth>=2.28",
    "google-api-python-client>=2.120",
]
# Everything needed to run the test suite (pytest tests -q). Pulls in all
# three providers' dependencies, since the suite covers all three.
test = [
    "lensix-inventory[aws,azure,gcp]",
    "pytest>=7",
]

[project.scripts]
lensix-inventory = "lensix_inventory.cli:main"

[tool.setuptools.packages.find]
include = ["lensix_inventory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
