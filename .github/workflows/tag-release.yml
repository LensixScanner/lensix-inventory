name: Tag Release

# Keeps git tags in sync with lensix_inventory/__init__.py's __version__ —
# the single source of truth for the version number (pyproject.toml reads
# it from there via [tool.setuptools.dynamic]), and this workflow is what
# turns a version bump there into the actual `vX.Y.Z` tag that
# lensix-scanner-light's requirements.txt files (and anyone else
# installing straight from a GitHub tarball URL) pin against. Runs only
# when that file changes, and is a no-op if that version's tag already
# exists (e.g. a push to main that didn't bump the version).

on:
  push:
    branches: [main]
    paths:
      - lensix_inventory/__init__.py

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Read version from lensix_inventory/__init__.py
        id: version
        run: |
          # Parsed with ast rather than imported, so this keeps working even
          # if the package's __init__ ever grows imports of third-party deps.
          VERSION=$(python3 -c "import ast; print(next(n.value.value for n in ast.parse(open('lensix_inventory/__init__.py').read()).body if isinstance(n, ast.Assign) and any(getattr(t, 'id', None) == '__version__' for t in n.targets)))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already tagged
        id: check
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ steps.version.outputs.version }}$"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
